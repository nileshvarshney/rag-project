<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="40" height="40" rx="9" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="38" height="19" rx="8.5" fill="white" fill-opacity="0.06"/>

  <!-- Outer triangle connections (faint) -->
  <line x1="20" y1="8"  x2="10" y2="30" stroke="white" stroke-width="0.9" stroke-opacity="0.18" stroke-linecap="round"/>
  <line x1="20" y1="8"  x2="30" y2="30" stroke="white" stroke-width="0.9" stroke-opacity="0.18" stroke-linecap="round"/>
  <line x1="10" y1="30" x2="30" y2="30" stroke="white" stroke-width="0.9" stroke-opacity="0.18" stroke-linecap="round"/>

  <!-- Hub → satellite lines (strong) -->
  <line x1="20" y1="10.4" x2="20" y2="17.2" stroke="white" stroke-width="1.6" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="11.8" y1="28.4" x2="16.8" y2="23.2" stroke="white" stroke-width="1.6" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="28.2" y1="28.4" x2="23.2" y2="23.2" stroke="white" stroke-width="1.6" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- Center hub -->
  <circle cx="20" cy="21" r="4" fill="white" filter="url(#glow)"/>

  <!-- Satellite nodes -->
  <circle cx="20" cy="8"  r="2.4" fill="white" fill-opacity="0.92"/>
  <circle cx="10" cy="30" r="2.4" fill="white" fill-opacity="0.92"/>
  <circle cx="30" cy="30" r="2.4" fill="white" fill-opacity="0.92"/>

  <!-- Inner hub dot (indigo) for depth -->
  <circle cx="20" cy="21" r="1.8" fill="#6366f1"/>
</svg>
